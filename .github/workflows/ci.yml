name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Verify hosted configuration contract
        run: npm run check:hosted-config
        env:
          VERCEL: "1"
          WAIVER_API_BASE_URL: https://api.example.test
          WAIVER_WEB_AUTH_MODE: auth0
          AUTH0_DOMAIN: tenant.example.test
          AUTH0_CLIENT_ID: ci-client
          AUTH0_CLIENT_SECRET: ci-client-secret
          AUTH0_SECRET: ci-auth0-session-secret-is-at-least-32-bytes
          APP_BASE_URL: https://app.example.test

      - name: Build
        run: npm run build
        env:
          AUTH0_CLIENT_SECRET: ci-auth0-secret-must-stay-server-side

      - name: Verify client boundary
        run: npm run check:client-boundary

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run critical browser flows
        run: npm run test:e2e
